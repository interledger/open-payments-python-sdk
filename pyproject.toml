[project]
name = "open-payments-sdk"
version = "0.1.0"
description = "Python SDK implementation for open-payments API"
authors = [
    {name = "Yiannis Giannelos",email = "johngiannelos@gmail.com"},
    {name = "Elijah Okello", email = "elijahokello90@gmail.com"},
    {name = "Kasweka Michael Mukoko", email = "kaswekamukoko@gmail.com"}
]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "cryptography (>=50.0.2,<51.0.0)",
    "http-message-signatures (>=2.0.1,<3.0.0)",
    "http-sf (>=1.0.7,<1.1.0)",
    "python-ulid[pydantic] (>=3.1.0,<4.0.0)",
    "rfc3986-validator (>=0.1.1,<0.2.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ipdb = "^0.13.13"
isort = "^6.0.0"
black = "^26.10.1"
pyflakes = "^3.2.0"
datamodel-code-generator = "^0.81.0"
pytest = "^9.0.3"
pyyaml = "^6.0.2"

[tool.poetry.group.live]
optional = true

[tool.poetry.group.live.dependencies]
pydantic-settings = ">=2.10.6,<3.0.0"

[tool.poetry.group.notebooks]
optional = true

[tool.poetry.group.notebooks.dependencies]
jupyterlab = {version = "^4.5.0", python = ">=3.11.5"}

[tool.poetry.group.browser]
optional = true

[tool.poetry.group.browser.dependencies]
selenium = "^4.38.0"

[tool.poetry.group.examples]
optional = true

[tool.poetry.group.examples.dependencies]
flask = "^3.1.3"
python-dotenv = "^1.2.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "live: requires --run-live and a configured Open Payments provider",
    "browser: requires --run-live --run-browser and browser tooling",
]
