name: Test Python open payments sdk

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ${{ matrix.os }}

    env:
      POETRY_VIRTUALENVS_CREATE: "true"
      POETRY_VIRTUALENVS_IN_PROJECT: "true"

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10","3.11","3.12","3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: python -m pip install "poetry==2.5.2"

      - name: Select project Python
        run: python -m poetry env use "${{ steps.python.outputs.python-path }}"

      - name: Verify project Python
        env:
          SDK_EXPECTED_PYTHON_VERSION: ${{ matrix.python-version }}
        run: >-
          python -m poetry run python -c
          "import os, sys;
          expected = tuple(map(int, os.environ['SDK_EXPECTED_PYTHON_VERSION'].split('.')));
          print(sys.executable);
          print(sys.version);
          assert sys.version_info[:2] == expected, (expected, sys.version_info[:2]);
          assert sys.prefix != sys.base_prefix, 'Expected an isolated project environment'"

      - name: Install dependencies
        run: python -m poetry install --no-interaction

      - name: Run offline tests
        run: python -m poetry run python -m pytest -ra

      - name: Install optional test dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m poetry install --with examples,live --no-interaction

      - name: Test optional components offline
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: >-
          python -m poetry run python -m pytest
          tests/unit/test_example_consent.py::TestCallbackServer
          tests/unit/test_live_settings.py -ra

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install audit tools
        run: >-
          python -m pip install
          "poetry==2.5.2"
          "poetry-plugin-export==1.10.2"
          "pip-audit==2.10.1"

      - name: Check lock consistency
        run: python -m poetry check --lock

      - name: Export all locked dependency groups
        run: |
          mkdir -p "${{ runner.temp }}/open-payments-audit"
          python -m poetry export --all-groups --format pylock.toml --output "${{ runner.temp }}/open-payments-audit/pylock.toml"

      - name: Audit locked dependencies
        run: >-
          python -m pip_audit --locked --strict --progress-spinner off
          "${{ runner.temp }}/open-payments-audit"

      - name: Audit runtime dependency resolution
        run: python -m pip_audit --strict --progress-spinner off .
